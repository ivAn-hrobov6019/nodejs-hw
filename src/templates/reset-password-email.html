<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        border-radius: 8px;
      "
    >
      <h2 style="margin-top: 0; color: #222222">Hello, {{name}}!</h2>

      <p style="color: #444444; line-height: 1.5">
        We received a request to reset your password. Click the button below to
        choose a new one. The link is valid for 15 minutes.
      </p>

      <p style="text-align: center; margin: 32px 0">
        <a
          href="{{link}}"
          style="
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
          "
        >
          Reset password
        </a>
      </p>

      <p style="color: #888888; font-size: 13px; line-height: 1.5">
        If the button does not work, copy this link into your browser:<br />
        {{link}}
      </p>

      <p style="color: #888888; font-size: 13px">
        If you did not request a password reset, just ignore this email.
      </p>
    </div>
  </body>
</html>
